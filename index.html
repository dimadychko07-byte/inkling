<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="description" content="Inkling — карты, из которых варится идея мира или персонажа.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><title>Inkling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Press+Start+2P&display=swap">
<style>
/* Layout: an ink-and-pixel phone app — header (era · title · shelf), four standard 5:7 cards in the middle, a fat black "brew" pill, and two big mode tabs at the bottom: World and Character. Deliberately one light paper look; colour appears only in the atmosphere palette. */
:root{
  --paper:#ffffff; --card:#ffffff; --ink:#131211; --ink-2:#4b4843; --ink-3:#8c877f; --soft:#ebe7e1; --liquid:#9a958e;
  --f-ui:"Tiny5", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --f-caps:"Press Start 2P", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:light;
}
/* тёмная тема — та же картинка, инвертированная; цвета палитры в воздухе и манере не меняются */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --paper:#121212; --card:#121212; --ink:#f1ede6; --ink-2:#bdb8af; --ink-3:#8a857c; --soft:#2a2826; --liquid:#6d6964; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#121212; --card:#121212; --ink:#f1ede6; --ink-2:#bdb8af; --ink-3:#8a857c; --soft:#2a2826; --liquid:#6d6964; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%; overflow:hidden; margin:0}
body{background:var(--paper); color:var(--ink); font-family:var(--f-ui); font-size:16px; line-height:1.35; display:flex; justify-content:center; -webkit-tap-highlight-color:transparent}
p{margin:0}
button,select,input{font:inherit; color:var(--ink)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.pcard:focus-visible{outline:3px dashed var(--ink); outline-offset:3px}

.app{position:relative; height:100%; width:100%; max-width:480px; display:flex; flex-direction:column; background:var(--paper);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{flex:none; display:grid; grid-template-columns:48px 1fr 48px; align-items:center; gap:10px; padding:12px 0 8px}
.sq{position:relative; width:48px; height:48px; border-radius:12px; border:2.5px solid var(--ink); background:var(--card); display:flex; align-items:center; justify-content:center; padding:0}
.rd{position:relative; width:48px; height:48px; border-radius:50%; border:none; background:var(--ink); color:var(--card); display:flex; align-items:center; justify-content:center; padding:0}
.rd[aria-pressed=true]{background:var(--card); color:var(--ink); border:2.5px solid var(--ink)}
.ttl{text-align:center; min-width:0}
.ttl b{display:block; font-family:var(--f-caps); font-weight:400; font-size:15px; letter-spacing:.04em}
.ttl small{display:block; font-size:14px; color:var(--ink-2); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{position:absolute; top:-6px; right:-6px; min-width:22px; height:22px; padding:0 5px; border-radius:11px; background:var(--ink); color:var(--card); font-size:13px; display:flex; align-items:center; justify-content:center; border:2.5px solid var(--paper)}
.rd[aria-pressed=true] .dot{background:var(--ink)}

.view{flex:1; min-height:0; position:relative}
.scr{position:absolute; inset:0; display:flex; flex-direction:column; gap:10px; padding:4px 0 10px; animation:fadein .25s ease both}
@keyframes fadein{from{opacity:0; transform:translateY(6px)}}
.scr h2{margin:0; font-family:var(--f-caps); font-weight:400; font-size:15px; line-height:1.3; text-align:center}
.lead{text-align:center; color:var(--ink-2); font-size:15px}

/* main action */
.cta{flex:none; margin:4px 0 10px; height:58px; width:100%; border-radius:999px; border:none; background:var(--ink); color:var(--card); display:flex; align-items:center; justify-content:center; gap:14px; font-family:var(--f-caps); font-size:14px; letter-spacing:.04em; text-transform:uppercase; transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.7; cursor:wait}
.cta.urge{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.025)}}
.cta svg{flex:none}

/* two mode tabs */
.modes{flex:none; display:grid; grid-template-columns:auto 1fr 1fr; gap:10px; padding:0 0 calc(12px + env(safe-area-inset-bottom, 0px))}
.modes:has(#newBtn[hidden]){grid-template-columns:1fr 1fr}
.newidea{height:62px; width:78px; border-radius:18px; border:2.5px solid var(--ink); background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:0 4px; font-size:12.5px; line-height:1.05; text-align:center}
.newidea:active{transform:scale(.96)}

/* вводный экран: роли */
.roles{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; justify-content:center}
.roles h2{margin-bottom:6px}
.role{border:2.5px solid var(--ink); border-radius:16px; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:14px 6px; text-align:center; min-width:0}
.role span{font-size:14px; line-height:1.15; max-width:100%; overflow-wrap:anywhere}
.role-grid .role{aspect-ratio:1/1}
.role[aria-pressed=true]{background:var(--ink); color:var(--card)}
.role.main{align-self:center; width:min(100%,260px); flex-direction:row; gap:12px; padding:16px 22px}
.role.main span{font-size:17px}
.role-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}

/* выбор эпохи одной картой */
.stage{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; container-type:size}
.stage .pcard{flex:none; width:min(62cqw, calc((100cqh - 136px) * 5 / 7)); aspect-ratio:5/7; touch-action:pan-y}
/* жанры: одна строка, листается пальцем вбок */
.genres{flex:none; width:100%; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; padding:2px 0;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent); mask-image:linear-gradient(90deg,#000 88%,transparent)}
.genres::-webkit-scrollbar{display:none}
.genres .label{flex:none; margin-right:2px}
.genres button{flex:none; border:2px solid var(--ink); border-radius:999px; background:var(--card); color:var(--ink); padding:4px 11px; font-size:15px}
.genres button:last-child{margin-right:28px}
.genres button[aria-pressed=true]{background:var(--ink); color:var(--card)}
.pcard.era{background:var(--ink); color:var(--card); gap:14px}
.pcard.era .kind{color:color-mix(in srgb, var(--card) 62%, var(--ink))}
.pcard.era .name{font-family:var(--f-caps); font-size:17px; line-height:1.4; text-transform:uppercase}
.pcard.era .count{position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:14px; color:color-mix(in srgb, var(--card) 62%, var(--ink))}
.eranav{display:flex; align-items:center; gap:10px}
.eranav .mini{width:46px; height:46px}
.eranav .pill{padding:8px 14px}

/* маленькая карта эпохи над столом */
.era-mini{align-self:center; display:flex; align-items:center; gap:10px; background:none; border:none; padding:0}
.era-mini .cardlet{width:44px; aspect-ratio:5/7; border-radius:8px; background:var(--ink); color:var(--card); display:flex; align-items:center; justify-content:center; border:2px solid var(--ink)}
.era-mini b{font-family:var(--f-caps); font-weight:400; font-size:11px; text-transform:uppercase; text-align:left; line-height:1.5}
.era-mini small{display:block; font-size:13px; color:var(--ink-3)}

/* строка ремесла в рецепте */
.extra{margin-top:12px; border:2.5px dashed var(--ink); border-radius:16px; padding:12px 16px; font-size:16.5px; line-height:1.4}
.extra b{display:block; font-family:var(--f-caps); font-weight:400; font-size:10px; letter-spacing:.06em; margin-bottom:6px}
.mode{height:62px; border-radius:18px; border:2.5px solid var(--ink); background:var(--card); display:flex; align-items:center; justify-content:center; gap:10px; font-family:var(--f-caps); font-size:12px; text-transform:uppercase; letter-spacing:.03em}
.mode[aria-pressed=true]{background:var(--ink); color:var(--card)}

/* cards */
.hand{flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,auto); grid-template-rows:repeat(2,auto); gap:10px; place-items:center; align-content:center; justify-content:center; container-type:size}
/* стандартная игральная карта 5:7, размер подбирается под свободное место */
.hand .pcard{width:min(calc((100cqw - 10px) / 2), calc((100cqh - 10px) / 2 * 5 / 7)); aspect-ratio:5/7}
.pcard{position:relative; background:var(--card); color:var(--ink); border:2.5px solid var(--ink); border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:30px 10px 36px; text-align:center; overflow:hidden; user-select:none; transition:transform .15s, box-shadow .15s}
.pcard.tap{cursor:pointer}
.pcard.tap:active{transform:scale(.97)}
.pcard .kind{position:absolute; top:11px; left:12px; max-width:calc(100% - 50px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3)}
.pcard .name{max-width:100%; font-size:18px; line-height:1.2; text-wrap:balance; overflow-wrap:normal; display:flex; flex-direction:column; gap:5px}
.pcard .name small{font-size:.8em; color:var(--ink-2)}
.pcard .era-sel{position:absolute; bottom:9px; left:50%; transform:translateX(-50%); max-width:calc(100% - 18px); font-size:13px; padding:2px 6px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); z-index:2}
.pin{position:absolute; top:6px; right:6px; width:30px; height:30px; padding:0; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--card); color:var(--ink); border:2px solid var(--ink); z-index:3}
.pcard.locked{box-shadow:4px 4px 0 var(--ink); transform:translate(-2px,-2px)}
.pcard.locked .pin{background:var(--ink); color:var(--card)}
.pcard.link{background:var(--ink); color:var(--card)}
.pcard.link .kind{color:color-mix(in srgb, var(--card) 62%, var(--ink))}
.pcard.link .name small{color:color-mix(in srgb, var(--card) 82%, var(--ink))}
.pcard.link .pin{background:var(--ink); color:var(--card); border-color:var(--card)}
.pcard.link.locked{box-shadow:4px 4px 0 var(--ink-3)}
.pcard.link.locked .pin{background:var(--card); color:var(--ink)}
.pcard .other{position:absolute; bottom:38px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--ink-3); white-space:nowrap}
.swatches{display:flex; gap:5px; justify-content:center; align-items:center; margin-top:3px}
.swatches i{width:16px; height:16px; border-radius:50%; border:2px solid var(--ink)}
.swatches i.acc{width:20px; height:20px; margin-left:3px; box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--ink)}
.flip{animation:flip .4s ease both}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

.row{display:flex; align-items:center; gap:8px}
.row.center{justify-content:center}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:999px; padding:2px; background:var(--card)}
.seg button{border:none; background:transparent; border-radius:999px; padding:5px 12px; font-size:15px; color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--ink); color:var(--card)}
.mini{width:38px; height:38px; padding:0; border-radius:50%; border:2px solid var(--ink); background:var(--card); display:inline-flex; align-items:center; justify-content:center}
.empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; color:var(--ink-2); padding:0 20px; font-size:17px}
.pill{border:2.5px solid var(--ink); border-radius:999px; background:var(--card); padding:9px 16px; font-size:15px}
.pill.dark{background:var(--ink); color:var(--card)}

/* era sheet */
.label{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.eras{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.opt{border:2.5px solid var(--ink); border-radius:14px; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:12px 4px; min-width:0; text-align:center}
.opt span{font-size:15px; line-height:1.15}
.opt[aria-pressed=true]{background:var(--ink); color:var(--card)}
.customrow{display:flex; gap:8px}
.customrow input{flex:1; min-width:0; border:2.5px solid var(--ink); border-radius:999px; padding:10px 16px; background:var(--card)}
.customrow input::placeholder{color:var(--ink-3)}
.sheet-sec{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}

/* shelf */
.slots{flex:1; min-height:0; display:grid; grid-template-columns:repeat(3,auto); grid-template-rows:repeat(2,auto); gap:10px; place-items:center; align-content:center; justify-content:center; container-type:size}
.slots .slot{width:min(calc((100cqw - 20px) / 3), calc((100cqh - 10px) / 2 * 4 / 5)); aspect-ratio:4/5}
.slot{position:relative; border:2.5px solid var(--ink); border-radius:16px; background:var(--card); padding:8px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; min-height:0; text-align:center; overflow:hidden}
button.slot{cursor:pointer}
.slot .tm{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; border:2px solid var(--ink); border-radius:999px; padding:1px 8px}
.slot .tm.hot{background:var(--ink); color:var(--card); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--card); color:var(--ink)}}
.slot .art{flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
.slot .art svg{max-height:100%; width:auto}
.slot .nm{font-size:14px; line-height:1.15; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.slot.empty{border-style:dashed; justify-content:center; color:var(--ink-3)}
.slot.empty .plus{width:40px; height:40px; border-radius:50%; border:2.5px dashed var(--ink-3); display:flex; align-items:center; justify-content:center; font-size:24px}
.slot.empty .nm{white-space:normal}
.slot.broken{background:repeating-linear-gradient(45deg, var(--card) 0 6px, var(--soft) 6px 8px); border-style:dashed}
.slot.broken .nm{text-decoration:line-through; color:var(--ink-2)}
.slot.broken .why{font-size:12px; color:var(--ink-2); line-height:1.2}
.sweep{width:100%; padding:5px 6px; font-size:13px; border-radius:999px; background:var(--ink); color:var(--card); border:none}
.slot.shake .art svg{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.slot.cracking .art{animation:crack .8s ease-in both}
@keyframes crack{30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(.9) rotate(5deg)}}
.slot.swept{animation:swept .45s ease-in forwards}
@keyframes swept{to{opacity:0; transform:translateX(30px) rotate(5deg)}}
.done-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; align-content:start; overflow-y:auto; min-height:0; flex:1}
.done-v{border:2.5px solid var(--ink); background:var(--card); border-radius:14px; padding:6px 4px; display:flex; flex-direction:column; align-items:center; gap:2px}
.done-v span{font-size:12.5px; line-height:1.15; text-align:center; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

/* sheet */
.sheet{position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; justify-content:flex-end}
.sheet .back{position:absolute; inset:0; background:rgba(0,0,0,.4); animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.panel{position:relative; max-height:90%; overflow-y:auto; background:var(--card); border:2.5px solid var(--ink); border-bottom:none; border-radius:26px 26px 0 0; margin:0 -2px; padding:22px 20px calc(18px + env(safe-area-inset-bottom, 0px)); animation:up .32s cubic-bezier(.2,.9,.3,1.08) both}
@keyframes up{from{transform:translateY(100%)}}
.panel .grab{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:42px; height:5px; border-radius:3px; background:var(--soft)}
.panel .x{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; padding:0; border:2px solid var(--ink); background:var(--card); display:flex; align-items:center; justify-content:center}
.panel .head{display:flex; gap:14px; align-items:center; margin-bottom:12px; padding-right:34px}
.panel .head .t{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
.panel h3{margin:0; font-family:var(--f-caps); font-weight:400; font-size:16px; line-height:1.35; text-wrap:balance}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{font-size:13px; border:2px solid var(--ink); border-radius:999px; padding:0 9px}
.picture{border:2.5px solid var(--ink); border-radius:16px; padding:14px 16px; font-size:19px; line-height:1.4; position:relative; background:var(--paper)}
.picture b{display:block; font-family:var(--f-caps); font-weight:400; font-size:10px; letter-spacing:.06em; margin-bottom:8px}
.ingr{display:grid; grid-template-columns:auto 1fr; gap:7px 12px; align-items:baseline; margin:14px 0 0}
.ingr dt{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; gap:5px; align-items:center; white-space:nowrap}
.ingr dt svg{align-self:center; color:var(--ink)}
.ingr dd{margin:0; font-size:16px; line-height:1.3; min-width:0}
.ingr dd .swatches{display:inline-flex; vertical-align:middle; margin-left:6px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.spell{margin-top:12px; border:2.5px solid var(--ink); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; background:var(--paper)}
.spell .c2{display:flex; flex-wrap:wrap; gap:6px}
.spell .c2 button{border-radius:999px; background:var(--card); border:2px solid var(--ink); font-size:14px; padding:4px 11px}
.spell .c2 button[aria-pressed=true]{background:var(--ink); color:var(--card)}
.spell p{font-size:15px; color:var(--ink-2)}
.brewing{display:flex; flex-direction:column; align-items:center; gap:12px; padding:22px 0; font-size:19px}
.brewing svg{animation:wob 1s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-6deg) translateY(-3px)}}
.sheet-title{margin:0 0 12px; font-family:var(--f-caps); font-weight:400; font-size:14px}
.status{margin-top:10px; font-size:15px; color:var(--ink-2)}
.toast{position:absolute; left:50%; top:72px; transform:translateX(-50%); z-index:30; padding:8px 16px; border-radius:999px; background:var(--ink); color:var(--card); font-size:15px; white-space:nowrap; animation:toast 2.6s ease both; pointer-events:none}
.toast.bad{background:var(--card); color:var(--ink); border:2.5px solid var(--ink)}
@keyframes toast{0%{opacity:0; transform:translate(-50%,-8px)}10%,80%{opacity:1; transform:translate(-50%,0)}100%{opacity:0}}
@media (max-height:680px){.mode{height:52px} .cta{height:50px} .pcard .glyph svg{width:28px; height:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app" lang="ru">
  <header class="top">
    <button class="sq" id="menuBtn" type="button" aria-label="Настройки: роль, тема, звук"></button>
    <div class="ttl"><b>INKLING</b><small id="ttlSub">лавка идей</small></div>
    <button class="rd" id="shelfBtn" type="button" aria-label="Полка" aria-pressed="false"></button>
  </header>
  <main class="view" id="view">
    <section class="scr" id="s-table" aria-label="Стол"></section>
    <section class="scr" id="s-shelf" aria-label="Полка" hidden></section>
  </main>
  <button class="cta" id="brewBtn" type="button"></button>
  <nav class="modes" aria-label="Что варим">
    <button class="newidea" id="newBtn" type="button" aria-label="Новая идея: начать заново с выбора эпохи"></button>
    <button class="mode" data-m="world" type="button"></button>
    <button class="mode" data-m="char" type="button"></button>
  </nav>
  <div class="sheet" id="sheet" hidden><div class="back" id="sheetBack"></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
</div>

<script>
/* ==========================================================================
   СПИСКИ. Главное правило: каждую фразу должно быть видно (или слышно) за 3 секунды.
   Элементы списка разделяются знаком «|». Пишите фразы с заглавной буквы.
   Среда и Облик берутся из выбранной эпохи, Предмет и Деталь — из другой
   (режимы «смело» и «безумно»), в этом и есть контраст.

function noun(raw){ const [w,tag]=raw.split('*'); const word=w.trim(); if(tag&&GMAP[tag.trim()]) return {w:word,g:GMAP[tag.trim()]};
  const head=word.split(/[\s-]/)[0]; return {w:word, g:/[ая]$/.test(head)?'f':/[оеё]$/.test(head)?'n':/[ыи]$/.test(head)?'pl':'m'}; }
function adj(a,g){ if(g==='m'||!/(ый|ой|ий)$/.test(a)) return a; const stem=a.slice(0,-2), end=a.slice(-2), last=stem.slice(-1), velar='гкх', hush='жшчщ';
  if(end==='ий'){ if(velar.includes(last)) return stem+{f:'ая',n:'ое',pl:'ие'}[g]; if(hush.includes(last)) return stem+{f:'ая',n:'ее',pl:'ие'}[g]; return stem+{f:'яя',n:'ее',pl:'ие'}[g]; }
  return stem+{f:'ая', n:(hush.includes(last)&&end==='ый')?'ее':'ое', pl:(velar+hush).includes(last)?'ие':'ые'}[g]; }

function noise(dur,vol=.2,freq=2000,type='bandpass',when=0,q=1){ const c=ac(); if(!c) return; const t=c.currentTime+when, n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);

// stage: role — первый экран «Кто ты?», era — одна большая карта эпохи, table — стол с четырьмя картами
const S={role:null, stage:'role', pick:null, mode:'world', era:null, genre:'any', customEra:'', mad:1, scr:'table', hands:{world:blankHand(), char:blankHand()},
  potion:null, stale:false, brewing:false, spellMs:864e5, shelved:false, shelfTab:'live'};
const $=id=>document.getElementById(id);
const PREF_KEY='inkling-pref-v8';
function savePref(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify({role:S.role?S.role.id:null, mode:S.mode, era:S.era?S.era.id:null, genre:S.genre, customEra:S.customEra, mad:S.mad})); }catch(e){} }
function loadPref(){ try{ return JSON.parse(localStorage.getItem(PREF_KEY)||'null'); }catch(e){ return null; } }
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function toast(msg,bad){ const t=el('div','toast'+(bad?' bad':''),msg); $('app').appendChild(t); setTimeout(()=>t.remove(),2700); }

function customEraObj(){ return {id:'custom', name:S.customEra, icon:'quill'}; }
const eraById=id=>id==='custom'?customEraObj():id==='mix'?{id:'mix',name:'Смесь эпох',icon:'swirl'}:ERAS.find(e=>e.id===id);
// у своей эпохи нет своих списков: берём слова случайной эпохи, а подпись оставляем свою
const lists=era=>(!era||era.id==='custom'||era.id==='mix')?rnd(ERAS):era;
function baseEra(){ return S.era.id==='mix'?rnd(ERAS):S.era; }
function otherEra(from){ const pool=ERAS.filter(e=>!from||e.id!==from.id); return rnd(pool); }
const hand=()=>S.hands[S.mode];
const genreLists=()=>(S.genre==='any'?rnd(GENRES.slice(1)):genreById(S.genre)).lists;

function draw(k,keepEra){
  const H=hand(), c=H[k], old=JSON.stringify(c.v), w=S.mode==='world'; let n=0;
  do{
    if(k==='a'){ if(!keepEra) c.era=c.era||baseEra(); c.v=rnd(lists(c.era)[w?'env':'look']); }
    else if(k==='b'){
      if(!keepEra) c.era = S.mad===0 ? H.a.era : otherEra(H.a.era);
      c.wild = !keepEra && S.mad===2 && chance(.45);
      c.v = c.wild ? rnd(w?L.wildObj:L.wildDetail) : rnd(lists(c.era)[w?'obj':'detail']);
    }
    else if(k==='c'){
      const src=lists(H.a.era), G=genreLists(), pal=(src.pal&&chance(.7))?rnd(src.pal):Math.floor(Math.random()*PAL.length);
      c.v = w ? {main:(src.light&&chance(.7))?rnd(src.light):rnd(L.lightGen), sub:rnd(G.sounds), pal}
              : {main:rnd(L.smells), sub:rnd(G.habits), pal};
    }
    else { const G=genreLists(); c.v = w ? {role:rnd(G.worldRoles), why:rnd(G.worldWhy)} : {role:rnd(G.charRoles), why:rnd(G.charWhy)}; }
  }while(JSON.stringify(c.v)===old && ++n<5);
}
function deal(mode){
  const keep=S.mode; S.mode=mode; const H=hand();
  H.a.era=baseEra(); ['a','b','c','link'].forEach(k=>{ H[k].lock=false; draw(k); });
  S.mode=keep;
}
function dealBoth(){ deal('world'); deal('char'); S.potion=null; S.stale=false; S.shelved=false; }

/* ---------- шапка, вкладки, главная кнопка ---------- */
function renderChrome(){
  $('menuBtn').innerHTML=SV(S.role?S.role.icon:'gear',24,2);
  $('ttlSub').textContent=S.stage==='role'?'лавка идей':(S.role?S.role.name+' · ':'')+MODE[S.mode].name;
  const hideBottom=S.stage==='role'&&S.scr==='table';
  $('brewBtn').hidden=hideBottom; document.querySelector('.modes').hidden=hideBottom;
  $('newBtn').innerHTML=SV('restart',22,2)+'<span>Новая идея</span>'; $('newBtn').hidden=S.stage!=='table';
  const sb=$('shelfBtn'); sb.innerHTML=SV('flask',22,2); sb.setAttribute('aria-pressed',S.scr==='shelf');
  const broken=shelf.slots.filter(v=>v.broken).length, hot=shelf.slots.filter(v=>!v.broken&&v.due-Date.now()<864e5).length, live=shelf.slots.length;
  const n=broken||hot||live; if(n){ const d=el('span','dot',String(n)); sb.appendChild(d); }
  const b=$('brewBtn'); b.innerHTML=STAR(16)+'<span></span>'+STAR(16);
  b.querySelector('span').textContent=S.brewing?'Котёл бурлит…':S.stage==='era'?'Выбор сделан':'Сварить зелье';
  b.disabled=S.brewing; b.classList.toggle('urge',S.stale);
  document.querySelectorAll('.mode').forEach(m=>{ m.innerHTML=SV(MODE[m.dataset.m].icon,22,2)+'<span></span>'; m.querySelector('span').textContent=MODE[m.dataset.m].name; m.setAttribute('aria-pressed',S.scr==='table'&&S.mode===m.dataset.m); });
}
document.querySelectorAll('.mode').forEach(m=>m.onclick=()=>{ S.mode=m.dataset.m; S.potion=null; S.stale=false; S.shelved=false; savePref(); play('deal'); show('table'); });

$('menuBtn').onclick=()=>{ play('pin'); menuSheet(); };
$('brewBtn').onclick=()=>{
  if(S.scr!=='table'){ show('table'); if(S.stage!=='table') return; }
  if(S.stage==='era') confirmEra(); else if(S.stage==='table') brew();
};
// «Новая идея»: снимаем все булавки и возвращаемся к карте эпохи
$('newBtn').onclick=()=>{ ['world','char'].forEach(m=>Object.values(S.hands[m]).forEach(c=>{ c.lock=false; c.rndEra=false; }));

/* ---------- стол ---------- */
function markStale(){ if(S.potion && !S.brewing && !S.shelved){ S.stale=true; renderChrome(); } }
function renderTable(){
  const t=$('s-table'); t.innerHTML='';
  if(S.stage==='role') return renderRoles(t);
  if(S.stage==='era') return renderEraPick(t);
  const mini=el('button','era-mini'); mini.type='button'; mini.id='eraMini'; mini.setAttribute('aria-label','Эпоха: '+S.era.name+'. Выбрать другую');
  mini.innerHTML=`<span class="cardlet">${SV(S.era.icon||'era',22,2)}</span><span><b></b><small></small></span>`;
  mini.querySelector('b').textContent=S.era.name;
  mini.querySelector('small').textContent=(S.genre==='any'?'любой жанр':lc(genreById(S.genre).name))+' · сменить';
  mini.onclick=()=>{ S.pick=S.era; S.stage='era'; play('pin'); show('table'); };
  t.appendChild(mini);
  const h=el('div','hand'); h.id='hand';
  const row=el('div','row center');
  const seg=el('div','seg'); seg.setAttribute('role','group'); seg.setAttribute('aria-label','Насколько далёкие эпохи смешивать');
  MADNESS.forEach((n,i)=>{ const b=el('button',null,n); b.type='button'; b.setAttribute('aria-pressed',S.mad===i); b.onclick=()=>{ S.mad=i; savePref(); play('pin'); seg.querySelectorAll('button').forEach((x,j)=>x.setAttribute('aria-pressed',j===i)); }; seg.appendChild(b); });
  const dice=el('button','mini'); dice.type='button'; dice.innerHTML=SV('die',18,2); dice.setAttribute('aria-label','Перетасовать незакреплённые');
  dice.onclick=()=>{ const H=hand(); ['a','b','c','link'].forEach(k=>{ const c=H[k]; if(c.lock) return;
    if(c.rndEra){ c.era=otherEra(c.era); draw(k,true); } else { if(k==='a') c.era=baseEra(); draw(k); } }); markStale(); renderHand(true); play('deal'); };
  row.append(seg,dice); t.append(h,row); renderHand(true);
}
function eraSelect(c,k){
  const sel=el('select','era-sel'); sel.setAttribute('aria-label','Эпоха карты');
  const ro=el('option',null,c.rndEra?'Случайная · '+c.era.name:'Случайная эпоха'); ro.value='rnd'; if(c.rndEra) ro.selected=true; sel.appendChild(ro);
  const list=[...ERAS]; if(S.customEra) list.unshift(customEraObj());
  list.forEach(e=>{ const o=el('option',null,e.name); o.value=e.id; if(!c.rndEra&&c.era&&e.id===c.era.id&&!c.wild) o.selected=true; sel.appendChild(o); });
  if(c.wild){ const o=el('option',null,'Дикая колода'); o.value='wild'; o.selected=true; o.disabled=true; sel.appendChild(o); }
  sel.onclick=e=>e.stopPropagation(); sel.onkeydown=e=>e.stopPropagation();
  sel.onchange=()=>{ c.rndEra=sel.value==='rnd'; c.era=c.rndEra?otherEra(c.era):eraById(sel.value); c.wild=false; draw(k,true); markStale(); renderHand(); flip(k); play('flip'); };
  return sel;
}
function renderHand(anim){
  const h=$('hand'); if(!h) return; h.innerHTML='';
  const H=hand(), M=MODE[S.mode];
  ['a','b','c','link'].forEach(k=>{
    const c=H[k], [kind,icon]=M.kinds[k];
    const card=el('div','pcard tap'+(k==='link'?' link':'')+(c.lock?' locked':'')); card.dataset.k=k; card.tabIndex=0; card.setAttribute('role','button');
    card.innerHTML=`<span class="kind"></span><span class="glyph">${SV(icon,34,1.9)}</span><span class="name"></span>`;
    card.querySelector('.kind').textContent=kind;
    const nm=card.querySelector('.name');
    if(k==='c'){ const pal=PAL[c.v.pal]; nm.append(el('span',null,c.v.main), el('small',null,c.v.sub), swatchEl(pal)); card.setAttribute('aria-label',kind+': '+c.v.main+'. '+c.v.sub+'. '+pal[0]+', акцент '+pal[5]); }
    else if(k==='link'){ nm.append(el('span',null,'Это '+c.v.role), el('small',null,'чтобы '+c.v.why)); card.setAttribute('aria-label','Звено: это '+c.v.role+', чтобы '+c.v.why); }
    else { nm.textContent=c.v; card.setAttribute('aria-label',kind+': '+c.v); }
    const pin=el('button','pin'); pin.type='button'; pin.innerHTML=SV('pin',14,2); pin.setAttribute('aria-label',c.lock?'Открепить':'Закрепить'); pin.setAttribute('aria-pressed',c.lock);
    pin.onclick=e=>{ e.stopPropagation(); c.lock=!c.lock; play('pin'); renderHand(); };
    card.appendChild(pin);
    if(k==='a'||k==='b') card.appendChild(eraSelect(c,k));
    const redraw=()=>{ if(c.lock){ pin.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:300}); play('pin'); return; }
      if(c.rndEra){ c.era=otherEra(c.era); c.wild=false; }
      draw(k,k==='a'||!!c.rndEra); markStale(); renderHand(); flip(k); play('flip'); };
    card.onclick=redraw; card.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); redraw(); } };
    h.appendChild(card);
  });
  h.querySelectorAll('.pcard').forEach(fitCard);

function fitCard(card){
  const nm=card.querySelector('.name'); if(!nm) return;
  const cs=getComputedStyle(card), avail=card.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom); if(avail<=0) return;
  const used=()=>[...card.children].filter(e=>getComputedStyle(e).position!=='absolute'&&e.style.display!=='none').reduce((s,e)=>s+e.offsetHeight+7,-7);
  const wide=()=>nm.scrollWidth>nm.clientWidth+1;
  let fs=parseFloat(getComputedStyle(nm).fontSize), n=0;
  while((used()>avail||wide()) && fs>11 && n++<30){ fs-=.5; nm.style.fontSize=fs+'px'; }
  if(wide()) nm.style.overflowWrap='anywhere';
  if(used()>avail){ const g=card.querySelector('.glyph'); if(g) g.style.display='none'; }
}

const SPELLS=[['15 сек (тест)',15e3],['1 час',36e5],['1 день',864e5],['3 дня',2592e5],['7 дней',6048e5],['14 дней',12096e5],['30 дней',2592e6]];

function fmt(ms){ if(ms<=0) return '00:00:00'; const d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), m=Math.floor(ms%36e5/6e4), s=Math.floor(ms%6e4/1e3);
  return d? d+'д '+String(h).padStart(2,'0')+'ч' : String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function renderShelf(){

    const v=shelf.slots[i];
    if(i===5){ const b=el('button','slot empty'); b.type='button'; b.innerHTML=SV('flask',30,2)+'<span class="nm"></span>'; b.querySelector('.nm').textContent='Воплощено: '+shelf.done.length; b.onclick=()=>{ S.shelfTab='done'; renderShelf(); }; box.appendChild(b); continue; }
    if(!v){ const b=el('button','slot empty'); b.type='button'; b.innerHTML='<span class="plus">+</span><span class="nm">Свари зелье</span>'; b.onclick=()=>{ show('table'); if(S.stage==='table') brew(); }; box.appendChild(b); continue; }
    if(v.broken){
      const d=el('div','slot broken'); d.dataset.id=v.id;
      d.innerHTML=`<span class="art">${shardsSVG()}</span><span class="nm"></span><span class="why">Идея ушла к другому автору</span>`;
      d.querySelector('.nm').textContent=v.title;
      const sw=el('button','sweep','Смести осколки'); sw.type='button';
      sw.onclick=()=>{ play('sweep'); d.classList.add('swept'); setTimeout(()=>{ shelf.slots=shelf.slots.filter(x=>x.id!==v.id); writeShelf(); refresh(); },450); };
      d.appendChild(sw); box.appendChild(d); continue;
    }
    const b=el('button','slot'); b.type='button'; b.dataset.id=v.id; b.title=v.title;
    b.innerHTML=`<span class="tm"></span><span class="art">${flaskSVG(crackOf(v),'',46)}</span><span class="nm"></span>`;
    b.querySelector('.nm').textContent=v.title; updSlot(b,v);
    b.onclick=()=>{ play('clink'); openSheet(p=>recipe(p,v,'live')); }; box.appendChild(b);
  }
  t.appendChild(box);
}
function updSlot(b,v){ const t=b.querySelector('.tm'); if(!t) return; t.textContent=fmt(left(v)); t.classList.toggle('hot',left(v)<864e5);
  const cr=crackOf(v); b.querySelectorAll('.ck').forEach((p,i)=>p.setAttribute('opacity',i<cr?1:0)); b.classList.toggle('shake',cr>=3); }
function refresh(){ renderChrome(); if(S.scr==='shelf') renderShelf(); }
function tick(){
  let changed=false;
  shelf.slots.forEach(v=>{
    if(v.broken) return;
    const b=document.querySelector(`#slots .slot[data-id="${v.id}"]`);
    if(left(v)<=0){ v.broken=true; shelf.stats.broken++; changed=true; if(b) b.classList.add('cracking'); play('shatter'); toast('Склянка «'+v.title+'» разбилась',true); return; }
    const cr=crackOf(v); if(cr>(v.ck||0)){ v.ck=cr; writeShelf(); play('crack'); }
    if(b) updSlot(b,v);
  });
  const vs=$('vstatus'); if(vs&&vs.dataset.id){ const v=shelf.slots.find(x=>x.id===vs.dataset.id); if(v&&!v.broken) vs.textContent='Разобьётся через '+fmt(left(v)); }
  if(changed){ writeShelf(); setTimeout(refresh,800); }
}
setInterval(tick,1000);
setInterval(renderChrome,30000);

/* ---------- старт ---------- */
(function init(){
  const pref=loadPref();
  if(pref){ S.role=roleById(pref.role)||null; S.mode=MODE[pref.mode]?pref.mode:'world'; S.customEra=pref.customEra||''; S.mad=pref.mad??1; S.genre=genreById(pref.genre).id; if(pref.era){ const e=eraById(pref.era); if(e){ S.era=e; dealBoth(); } } }
  S.stage = !S.role ? 'role' : !S.era ? 'era' : 'table';
  show('table');
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
